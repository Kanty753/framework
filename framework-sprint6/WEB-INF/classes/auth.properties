# =============================================
# Configuration du système d'autorisation
# =============================================

# Clé de session utilisée pour vérifier si l'utilisateur est connecté.
# La valeur doit être non-null pour que l'utilisateur soit considéré authentifié.
auth.session.key=user

# Clé de session utilisée pour lire le rôle de l'utilisateur.
# La valeur peut être une String (rôle unique) ou une Collection<String> (multi-rôles).
auth.role.key=role

# Mode de refus d'accès :
#   "redirect" → redirige vers auth.login.url (pour les apps web classiques)
#   "status"   → renvoie un code HTTP 401/403 sans redirection (pour les API)
auth.denied.mode=redirect

# URL de la page de login, utilisée uniquement en mode "redirect".
# Doit être non-vide si auth.denied.mode=redirect et qu'il existe des routes protégées.
auth.login.url=/app/login
